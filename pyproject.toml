[project]
name = "scriptorium"
version = "0.1.0"
description = "Fábrica local de contenido de humanidades: da formato, no reescribe."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "markitdown[docx,pptx]>=0.1",
    "genanki>=0.13",
    "numpy>=1.26",
    "soundfile>=0.12",
    "rich>=13",
    "torch==2.14.1",
    "kokoro>=0.9.4",
]

[project.scripts]
scriptorium = "scriptorium.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scriptorium"]

# La Quadro GP100 (Pascal, sm_60) solo tiene soporte en las builds cu126 de PyTorch <= 2.14.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
